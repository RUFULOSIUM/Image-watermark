[project]
name = "image-watermark"
version = "0.3.0"
description = "Robust image watermarking with Reed-Solomon error correction, DCT embedding and pluggable payload schemas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "reedsolo>=1.7.0",
]

[project.scripts]
image-watermark = "image_watermark.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "image_watermark"
# The default schema ships inside the package so it is readable from
# an installed wheel, not just from a source checkout.
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
