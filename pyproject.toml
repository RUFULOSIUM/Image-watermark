[project]
name = "image-watermark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RUFULOSIUM", email = "rufuspregler@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "reedsolo>=1.7.0",
]

[project.scripts]
image-watermark = "image_watermark:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
